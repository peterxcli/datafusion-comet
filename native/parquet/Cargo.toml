[package]
name = "datafusion-comet-parquet"
version = { workspace = true }
edition = "2024"
license = { workspace = true }
publish = false

[dependencies]
arrow = { workspace = true }
arrow-schema = "59.2.0"
bytes = { workspace = true }
datafusion-common = { version = "55.0.0", features = ["parquet"] }
datafusion-common-runtime = "55.0.0"
datafusion-datasource = { workspace = true }
datafusion-datasource-parquet = "55.0.0"
datafusion-execution = "55.0.0"
datafusion-functions = "55.0.0"
datafusion-expr = "55.0.0"
datafusion-physical-expr = "55.0.0"
datafusion-physical-expr-adapter = { workspace = true }
datafusion-physical-expr-common = "55.0.0"
datafusion-physical-plan = "55.0.0"
datafusion-pruning = "55.0.0"
futures = { workspace = true }
itertools = "0.15.0"
log = "0.4"
object_store = { workspace = true }
parquet = { workspace = true, features = ["arrow", "async"] }
tokio = { version = "1", features = ["rt-multi-thread"] }


[dev-dependencies]
tempfile = "3.26.0"

[features]
default = ["parquet_encryption"]
parquet_encryption = ["parquet/encryption", "datafusion-common/parquet_encryption", "datafusion-execution/parquet_encryption"]
